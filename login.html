<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PSWDO Monthly Activity Monitoring System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="office-seal">
        <div class="seal-circle">PSWDO</div>
      </div>

      <h1 data-setting="SYSTEM_NAME">PSWDO Monthly Activity Monitoring System</h1>
      <p class="subtitle" data-setting="OFFICE_NAME">Provincial Social Welfare and Development Office</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            placeholder="Enter username" 
            autocomplete="username"
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter password" 
            autocomplete="current-password"
            required 
          />
        </div>

        <button type="submit" id="loginBtn">Login</button>

        <p id="loginMessage" class="message"></p>
      </form>

      <div class="login-footer" data-setting="PROVINCE">
        Province of Ifugao
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app-settings.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
